server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location = /health {
        proxy_pass http://search:8000/health;
    }
    location /search {
        proxy_pass http://search:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /listings {
        proxy_pass http://listing:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /bookings {
        proxy_pass http://booking:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
