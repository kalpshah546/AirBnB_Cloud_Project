# Docker "autoscaling" demo: Nginx load balancer + a scalable `search` service.
# Docker/Compose has NO built-in autoscaler. scripts/docker-autoscaler.sh watches container CPU
# and runs `docker compose up --scale search=N` (a custom control loop, like a tiny HPA).
#
#   docker compose -p airbnb-autoscale -f docker/compose.autoscale.yaml up -d --build
#   ./scripts/docker-autoscaler.sh            # in another terminal
#   k6 run -e BASE_URL=http://localhost:18081 loadtest/k6/search-spike.js
name: airbnb-autoscale
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airbnbpoc
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: local-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb -d airbnbpoc"]
      interval: 3s
      timeout: 3s
      retries: 30

  search:
    build:
      context: ..
      dockerfile: services/search/Dockerfile
    image: airbnb-autoscale-search:local
    cpus: 0.6            # CPU limit per container; the autoscaler measures utilization against this
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_NAME: airbnbpoc
      DB_USER: airbnb
      DB_PASSWORD: local-test-only
      DB_POOL_MIN: 1
      DB_POOL_MAX: 2
      CACHE_ENABLED: "false"
      BOOKING_ASYNC: "false"
      SEARCH_CPU_WORK_MS: 80
      LISTING_DATASET_SIZE: 20000
      WEB_CONCURRENCY: 1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "18081:80"
    volumes:
      - ./nginx.autoscale.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - search
    restart: unless-stopped
