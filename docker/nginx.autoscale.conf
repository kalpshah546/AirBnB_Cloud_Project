# Docker's embedded DNS (127.0.0.11) returns every replica of `search`. Using a variable in
# proxy_pass makes nginx re-resolve the name every few seconds, so new replicas are picked up
# and removed ones are dropped without reloading nginx.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        return 200 "ok\n";
    }

    location / {
        set $upstream search;
        proxy_pass http://$upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
