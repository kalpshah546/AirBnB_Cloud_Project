# Single-host, low-cost deployment (e.g. one t3.small). Not the autoscaling AWS setup.
# Secrets come from a server-side .env (chmod 600, never committed): DB_PASSWORD=...
# Run: docker compose -f compose.prod.yaml --env-file .env up -d --build
name: airbnb-soa-prod
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airbnbpoc
      POSTGRES_USER: airbnb
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb -d airbnbpoc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  search:
    build: { context: ., dockerfile: services/search/Dockerfile }
    environment: &app-env
      APP_ENV: production
      AWS_REGION: ap-south-1
      DB_HOST: postgres
      DB_NAME: airbnbpoc
      DB_USER: airbnb
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MIN: 1
      DB_POOL_MAX: 3
      CACHE_HOST: redis
      CACHE_ENABLED: "true"
      BOOKING_ASYNC: "false"   # no SQS/worker on this host; bookings write directly
      SEARCH_CPU_WORK_MS: 80
      LISTING_DATASET_SIZE: ${LISTING_DATASET_SIZE:-20000}
      WEB_CONCURRENCY: 2
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  listing:
    build: { context: ., dockerfile: services/listing/Dockerfile }
    environment:
      <<: *app-env
      WEB_CONCURRENCY: 1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  booking:
    build: { context: ., dockerfile: services/booking/Dockerfile }
    environment:
      <<: *app-env
      WEB_CONCURRENCY: 1
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [search, listing, booking]
    restart: unless-stopped

volumes:
  pgdata:
